<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>그림 맞추기 — 꼬물이 마을</title>
<style>
  html,body{margin:0;width:500px;height:400px;overflow:hidden;background:transparent;font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;color:#3b2f4a;user-select:none}
  .bg{position:absolute;left:22px;top:58px;width:456px;height:318px;background:#FCF9F2;border-radius:9px}
  .frame{position:absolute;inset:0;width:500px;height:400px;pointer-events:none}
  .bar{position:absolute;left:10px;top:12px;width:480px;height:44px;-webkit-app-region:drag}
  .title{position:absolute;left:62px;top:24px;font-size:14px;font-weight:700;color:#4b3c8c;pointer-events:none}
  .close{position:absolute;right:28px;top:20px;width:28px;height:28px;border:0;padding:0;background:none;cursor:pointer;-webkit-app-region:no-drag}
  .close img{width:100%;height:100%}
  .content{position:absolute;left:34px;top:79px;width:418px;height:278px;display:flex;gap:10px}
  .left{width:248px;display:flex;flex-direction:column;gap:5px}
  .paper{position:relative;width:248px;height:248px;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(80,60,140,.18);overflow:hidden}
  canvas,.paper img{position:absolute;inset:0;width:248px;height:248px;touch-action:none}
  canvas{cursor:crosshair}
  .tools{display:flex;align-items:center;gap:4px;height:26px}
  .dot{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(80,60,140,.3);cursor:pointer;padding:0}
  .dot.on{box-shadow:0 0 0 2px #4b3c8c}
  .tb{font:inherit;font-size:11px;font-weight:700;white-space:nowrap;border:0;border-radius:8px;padding:4px 5px;background:#efe9ff;color:#4b3c8c;cursor:pointer}
  .tb.on{background:#8f7be0;color:#fff}
  .right{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .who{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
  .who img{width:28px;height:28px;object-fit:contain}
  .timer{margin-left:auto;font-size:12px;color:#c2410c;font-weight:800}
  label{font-size:11px;font-weight:700;opacity:.75}
  input{font:inherit;font-size:13px;width:100%;box-sizing:border-box;border:1.5px solid #d9d0f2;border-radius:8px;padding:6px 8px;outline:none;background:#fff;color:#3b2f4a}
  input:focus{border-color:#8f7be0}
  .ok{font:inherit;font-size:13px;font-weight:800;border:0;border-radius:10px;padding:8px 10px;background:#8f7be0;color:#fff;cursor:pointer}
  .ok:disabled{background:#c9c0ea;cursor:default}
  .sub{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:10px;padding:6px 8px;background:#efe9ff;color:#4b3c8c;cursor:pointer}
  .sub:disabled{opacity:.5;cursor:default}
  .msg{font-size:11.5px;color:#c2410c;min-height:15px}
  .hints{display:flex;flex-direction:column;gap:3px;font-size:12px}
  .hints .h{background:#fff7d6;border-radius:8px;padding:4px 7px}
  .log{flex:1;overflow-y:auto;background:#fff;border-radius:10px;padding:5px 7px;font-size:12px;box-shadow:0 1px 2px rgba(80,60,140,.12);min-height:40px}
  .log div{padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log .good{color:#15803d;font-weight:800}
  .log .empty{opacity:.55}
  .row{display:flex;gap:5px}
  .row input{flex:1}
  .result{background:#efe9ff;border-radius:10px;padding:8px;font-size:13px;font-weight:700;line-height:1.45;text-align:center}
  .result b{color:#4b3c8c;font-size:15px}
  .hide{display:none !important}
</style>
</head>
<body>
  <div class="bg"></div>
  <img class="frame" src="assets/ui/report_frame.png" alt="">
  <div class="bar"></div>
  <div class="title">🖍 그림 맞추기</div>
  <button class="close" id="x" title="닫기"><img src="assets/ui/btn_close.png" alt="닫기"></button>
  <div class="content">
    <div class="left">
      <div class="paper"><canvas id="cv" width="496" height="496"></canvas><img id="pic" class="hide" alt=""></div>
      <div class="tools" id="tools"></div>
    </div>
    <div class="right" id="side"></div>
  </div>
  <script src="dist/quiz.js"></script>
</body>
</html>
